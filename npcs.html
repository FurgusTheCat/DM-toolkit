<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dungeon Toolkit — NPC Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    main{display:flex;gap:16px;padding:16px;align-items:flex-start}
    .controls{width:340px;background:var(--panel);padding:12px;border-radius:8px}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    label{display:flex;flex-direction:column;color:var(--muted);font-size:0.92rem}
    input,select,textarea{margin-top:6px;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:inherit}
    button{padding:8px;border-radius:6px;border:none;background:var(--accent);color:#002;cursor:pointer}
    .list{background:var(--panel);padding:12px;border-radius:8px;min-width:360px;color:var(--muted)}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,0.04);margin-right:6px;margin-bottom:6px}
    nav{padding:12px}
    a.back{color:var(--muted);text-decoration:none}
  </style>
</head>
<body>
  <nav><a class="back" href="index.html">&larr; Back</a></nav>

  <main>
    <section class="controls">
      <h2>NPC Generator — Taggable</h2>

      <div class="row">
        <label>Count: <input id="npcCount" type="number" min="1" max="80" value="8"></label>
        <button id="genNpcs">Generate NPCs</button>
        <button id="exportNpcs">Export JSON</button>
      </div>

      <div class="row">
        <label>Filter by tag (multi):</label>
        <div id="tagFilter" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>

      <div class="row">
        <label>Add custom tag: <input id="newTag" type="text" placeholder="e.g. 'smuggler'"><button id="addTag">Add</button></label>
      </div>

      <div class="row small">
        <div id="seedDisplay" class="small"></div>
        <button id="randomizeSeed">Randomize Seed</button>
      </div>

    </section>

    <section class="list">
      <h3>Generated NPCs</h3>
      <div id="npcList"></div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="npc.js"></script>
</body>
</html>
